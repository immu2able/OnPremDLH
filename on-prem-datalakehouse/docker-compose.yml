version: '3.8'
services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio/data:/data
      - ./minio/config.json:/root/.minio/config.json
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  spark:
    image: quay.io/jupyter/pyspark-notebook:latest
    container_name: spark
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ./notebooks:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
    command: >
      start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''
      --JupyterNotebookApp.allow_origin='*'
      --JupyterNotebookApp.ip='0.0.0.0'
      --JupyterNotebookApp.notebook_dir='/home/jovyan/work'
      --JupyterNotebookApp.allow_root=true
      --JupyterNotebookApp.disable_check_xsrf=true
      --spark.jars.packages="io.delta:delta-core_2.12:3.2.0,org.apache.hadoop:hadoop-aws:3.3.6"
      --spark.sql.extensions="io.delta.sql.DeltaSparkSessionExtension"
      --spark.sql.catalog.spark_catalog="org.apache.spark.sql.delta.catalog.DeltaCatalog"
      --spark.hadoop.fs.s3a.endpoint="http://minio:9000"
      --spark.hadoop.fs.s3a.access.key="minioadmin"
      --spark.hadoop.fs.s3a.secret.key="minioadmin"
      --spark.hadoop.fs.s3a.path.style.access="true"
      --spark.hadoop.fs.s3a.impl="org.apache.hadoop.fs.s3a.S3AFileSystem"
      --spark.hadoop.fs.s3a.connection.ssl.enabled="false"
      --spark.driver.extraJavaOptions="-Dcom.amazonaws.services.s3.enableV4=true"
      --spark.executor.extraJavaOptions="-Dcom.amazonaws.services.s3.enableV4=true"

  minio-setup:
    image: quay.io/minio/mc
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add minio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb minio/datalakehouse --ignore-existing;
      /usr/bin/mc policy set public minio/datalakehouse;
      /usr/bin/mc mb minio/datalakehouse/bronze;
      /usr/bin/mc mb minio/datalakehouse/silver;
      /usr/bin/mc mb minio/datalakehouse/gold;
      exit 0;
      "